PROJECT_NAME="omnitest"
DISPLAY_NAME="OmniTest 测试系统"
PORT="5100"

WORK_DIR="/opt/demo/omnitest"
COMPOSE_DIR="/opt/demo/omnitest"
COMPOSE_FILE="docker-compose.yml"
COMPOSE_SERVICE="omnitest"

# Windows 源码位置：D:\Task4\OmniTest
# 打包时在该父目录下 tar 出 omnitest 这个子目录
WINDOWS_PACK_BASE="D:\Task4"
WINDOWS_PACK_SOURCES="OmniTest"
PACK_NAME="omnitest"

SYSTEMD_SERVICE="omnitest-compose"
CONTAINER_NAMES="omnitest"

# 单核 CPU、1G 内存约束（与 docker-compose.yml 内一致）
MEM_LIMIT="1g"
CPU_LIMIT="1.0"
