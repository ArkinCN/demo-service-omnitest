# OmniTest nginx 站点配置（容器内 80 端口）
# 职责：静态托管前端产物；把 /api、/uploads 反代到同 compose 网络里的 backend:5100。

server {
    listen       80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # 上传体积：知识库文档/头像上传，放宽到 100M
    client_max_body_size 100m;

    # 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               application/x-javascript text/xml application/xml image/svg+xml;

    # 容器健康检查端点（自检脚本 check.sh / compose healthcheck 用）
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # 后端 API（前端发的是相对路径 /api/...）——禁用缓冲，保证 SSE 流式输出
    location /api/ {
        proxy_pass         http://backend:5100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_buffering      off;
        proxy_cache          off;
        proxy_read_timeout   600s;
        proxy_send_timeout   600s;
        proxy_connect_timeout 30s;

        chunked_transfer_encoding on;
    }

    # 用户上传/静态资源由后端托管（FastAPI 挂载 /uploads）
    location /uploads/ {
        proxy_pass         http://backend:5100;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # 前端静态资源：带 hash 的产物强缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
