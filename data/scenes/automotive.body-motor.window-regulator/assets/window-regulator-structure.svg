<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="电动玻璃升降器结构示意">
  <title>电动玻璃升降器结构示意</title>
  <desc>示意线稿，非任何厂商的真实产品结构。四部分：导轨、玻璃与托架、电机总成（有刷直流电机 + 蜗杆减速 + 绳轮）、防夹传感区。</desc>
  <rect width="1200" height="750" fill="#FFFFFF"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">

    <!-- 车门轮廓：整图视角的外框，卡内按中间带裁切后不出现 -->
    <rect x="40" y="150" width="1120" height="452" rx="20" stroke="#A8C5B5" stroke-width="1.4"/>
    <path d="M40 586 H1160" stroke="#A8C5B5" stroke-width="1.4"/>

    <!-- 窗口开口 -->
    <rect x="90" y="224" width="610" height="300" rx="8" stroke="#2E5E45" stroke-width="1.6"/>

    <!-- 防夹传感区：开口顶部的监测带 -->
    <rect x="90" y="224" width="610" height="68" rx="8" fill="#EAF2EC" stroke="#2E5E45" stroke-width="1.2" stroke-dasharray="7 5"/>
    <path d="M150 258 H640" stroke="#A8C5B5" stroke-width="1" stroke-dasharray="3 6"/>

    <!-- 导轨：左右各一条双线，上下延伸出裁切框 -->
    <path d="M138 200 V562 M150 200 V562 M640 200 V562 M652 200 V562" stroke="#2E5E45" stroke-width="1.5"/>

    <!-- 玻璃 -->
    <rect x="126" y="312" width="538" height="154" rx="4" fill="#EAF2EC" stroke="#2E5E45" stroke-width="1.6"/>
    <path d="M182 464 L262 316 M232 464 L312 316" stroke="#A8C5B5" stroke-width="1.1"/>
    <path d="M580 336 V446" stroke="#A8C5B5" stroke-width="1.2" stroke-dasharray="6 5"/>
    <path d="M572 348 L580 332 L588 348 M572 434 L580 450 L588 434" stroke="#A8C5B5" stroke-width="1.2"/>

    <!-- 玻璃托架与导轨滑块 -->
    <rect x="132" y="470" width="526" height="22" rx="7" stroke="#2E5E45" stroke-width="1.7"/>
    <rect x="136" y="462" width="16" height="38" rx="4" fill="#EAF2EC" stroke="#2E5E45" stroke-width="1.3"/>
    <rect x="638" y="462" width="16" height="38" rx="4" fill="#EAF2EC" stroke="#2E5E45" stroke-width="1.3"/>

    <!-- 传动绳：绳轮牵引玻璃托架 -->
    <path d="M766 452 L668 476" stroke="#A8C5B5" stroke-width="1.6"/>

    <!-- 电机总成：绳轮 + 蜗杆减速 + 有刷直流电机 -->
    <circle cx="790" cy="430" r="34" stroke="#2E5E45" stroke-width="1.6"/>
    <circle cx="790" cy="430" r="12" stroke="#2E5E45" stroke-width="1.3"/>
    <path d="M824 430 H836" stroke="#2E5E45" stroke-width="1.5"/>
    <rect x="836" y="401" width="84" height="58" rx="7" fill="#EAF2EC" stroke="#2E5E45" stroke-width="1.5"/>
    <path d="M852 409 V451 M866 409 V451 M880 409 V451 M894 409 V451" stroke="#A8C5B5" stroke-width="1"/>
    <path d="M920 430 H926" stroke="#2E5E45" stroke-width="1.5"/>
    <rect x="926" y="387" width="150" height="86" rx="14" stroke="#2E5E45" stroke-width="1.7"/>
    <circle cx="1001" cy="430" r="26" stroke="#2E5E45" stroke-width="1.4"/>
    <circle cx="1001" cy="430" r="9" stroke="#2E5E45" stroke-width="1.2"/>
    <path d="M944 402 V458 M956 402 V458 M968 402 V458" stroke="#A8C5B5" stroke-width="1"/>
    <path d="M1076 416 H1112 M1076 444 H1112" stroke="#A8C5B5" stroke-width="1.3"/>

    <!-- 指引线 -->
    <path d="M704 258 H734" stroke="#A8C5B5" stroke-width="1.2"/>
    <path d="M668 332 H734" stroke="#A8C5B5" stroke-width="1.2"/>
    <path d="M68 388 H134" stroke="#A8C5B5" stroke-width="1.2"/>
    <path d="M1001 477 V498" stroke="#A8C5B5" stroke-width="1.2"/>
  </g>

  <g font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei','Source Han Sans SC',sans-serif" font-size="25" font-weight="500" fill="#2C2C2C">
    <text x="744" y="266">防夹传感区</text>
    <text x="744" y="340">玻璃</text>
    <text x="60" y="396" text-anchor="end">导轨</text>
    <text x="1001" y="520" text-anchor="middle">电机总成</text>
  </g>
</svg>
